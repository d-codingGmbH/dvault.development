name: CI

run-name: ${{ github.event_name == 'workflow_dispatch' && format('CI {0} @ {1}', github.event.inputs.target_ref, github.event.inputs.expected_sha) || format('CI {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, tag, or commit ref to validate before integration."
        required: true
        type: string
      expected_sha:
        description: "Exact commit SHA that must be checked out and validated."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.inputs.expected_sha || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test, format, and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DVAULT_TEST_POSTGRES_CONNECTION_STRING: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_ref || github.ref }}
          fetch-depth: 0

      - name: Verify checked out commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "${{ github.event.inputs.expected_sha }}" ]; then
            echo "Expected ${{ github.event.inputs.expected_sha }}, got $actual_sha"
            exit 1
          fi

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore DVault.slnx --nologo

      - name: Format and docs validation (bash tools/check-format.sh)
        run: bash tools/check-format.sh

      - name: Build solution (dotnet build DVault.slnx --nologo)
        run: dotnet build DVault.slnx --nologo

      - name: Test default provider boundary (dotnet test DVault.slnx --nologo)
        run: dotnet test DVault.slnx --nologo --filter "Category!=ProviderIntegration.ExternalOptIn"

      - name: Pack packages (dotnet pack DVault.slnx --configuration Release --nologo)
        run: dotnet pack DVault.slnx --configuration Release --nologo

      - name: Verify packages (bash tools/verify-packages.sh)
        run: bash tools/verify-packages.sh
